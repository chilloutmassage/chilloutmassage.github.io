<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ChillOut Massage — العروض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a211c;--ink:#f3edd9;--mut:#a9bfae;--cu:#d2a24e;--card:#0f2f27;--line:#1f4a3e;--navy:#081a15;--ivory:#f4ecda;--cop:#d2a24e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a211c;--ink:#f3edd9;--mut:#a9bfae;--cu:#d2a24e;--card:#0f2f27;--line:#1f4a3e}}
:root[data-theme="dark"]{--bg:#0a211c;--ink:#f3edd9;--mut:#a9bfae;--cu:#d2a24e;--card:#0f2f27;--line:#1f4a3e}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 'Cairo',system-ui,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:10}
html[lang=en] body{font-family:'Jost',system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:'Amiri',serif;margin:0;font-weight:700}
html[lang=en] h2,html[lang=en] h3{font-family:'Cormorant Garamond',serif}
header.top{background:radial-gradient(120% 90% at 50% 0%,#17573f 0%,var(--navy) 62%);color:var(--ivory);padding:26px 0 30px;text-align:center;border-bottom:3px solid var(--cop)}
header.top.hero{background:linear-gradient(180deg,rgba(6,26,21,.10) 0%,rgba(6,26,21,.50) 42%,rgba(6,26,21,.97) 100%),var(--hero,none) center 18%/cover no-repeat,var(--navy);min-height:min(104vw,430px);display:flex;flex-direction:column;justify-content:flex-end}
header.top.hero .wrap{width:100%}
#lang{flex:none;background:var(--cop);color:var(--navy);border:0;border-radius:18px;padding:3px 14px;font:700 14px/1.7 'Jost','Cairo',sans-serif;cursor:pointer}
.brand{font:600 clamp(22px,7vw,34px)/1.15 'Cormorant Garamond',Georgia,serif;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 4px;text-wrap:balance}
.sub{font-family:'Amiri',serif;font-size:26px;color:var(--cop);line-height:1.4}
html[lang=en] .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px auto;color:var(--cop);font:500 12px 'Jost',sans-serif;letter-spacing:.3em}
.orn::before,.orn::after{content:"";width:48px;height:1px;background:var(--cop);opacity:.7}
.intro{font-size:14px;color:#d3cbb8;margin:0 auto;max-width:340px}
nav.idx{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--navy);border-bottom:1px solid #1f4a3e}
nav.idx .nv{display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;padding:9px 20px}
nav.idx .in{display:flex;gap:8px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
nav.idx a{flex:none;color:var(--ivory);text-decoration:none;font-size:14px;padding:3px 14px;border:1px solid #275548;border-radius:18px;white-space:nowrap}
section{padding:40px 0 6px}
.sh{display:flex;align-items:flex-end;gap:14px;padding-bottom:10px;margin-bottom:14px;border-bottom:1px solid var(--cu)}
.num{font:600 56px/.8 'Cormorant Garamond',serif;color:transparent;-webkit-text-stroke:1px var(--cu);letter-spacing:.02em}
h2{font-size:32px;line-height:1.2;flex:1;min-width:0}
.ph{position:relative;overflow:hidden;background:linear-gradient(135deg,#081a15,#14503c)}
.ph::before{content:"CO";position:absolute;inset:0;display:grid;place-items:center;font:600 24px 'Cormorant Garamond',serif;letter-spacing:.24em;color:var(--cop);opacity:.5}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph::after{content:"";position:absolute;inset:6px;border:1px solid rgba(244,236,218,.45);pointer-events:none}
.ph{aspect-ratio:2/3;margin:6px 0 16px;box-shadow:0 0 0 1px var(--cop)}
.pr{white-space:nowrap}
.pr b{font:700 28px/1 'Cormorant Garamond',serif;color:var(--cu);letter-spacing:.02em}
.pr small{font-size:12px;color:var(--mut);margin-inline-start:4px}
.pr s.old{font:600 17px 'Cormorant Garamond',serif;color:var(--mut);margin-inline-end:7px}
.item{padding:20px 0;border-bottom:1px solid var(--line)}
.item .hd{display:flex;align-items:baseline;gap:12px}
.item h3{flex:1;min-width:0;font-size:24px;line-height:1.3;overflow-wrap:anywhere}
.inc{margin:6px 0 0;font-size:14px;color:var(--mut);white-space:pre-line}
.note{margin:6px 0 4px;padding:12px 14px;background:var(--card);border:1px dashed var(--cu);font-size:14.5px}
.sm{font-size:13px;color:var(--mut);margin:10px 0 0}
footer{margin-top:44px;background:var(--navy);color:var(--ivory);padding:34px 0 40px;border-top:3px solid var(--cop)}
footer h2{color:var(--ivory);font-size:28px}
footer .sh{border-color:var(--cop)}
.eyebrow{font:500 12px 'Jost',sans-serif;letter-spacing:.22em;color:var(--cop);margin-bottom:6px}
footer .adr{font-size:15px;color:#d8d0bd}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0;padding:0;list-style:none}
.links a{display:flex;align-items:center;gap:10px;color:var(--ivory);text-decoration:none;padding:9px 10px;border:1px solid #275548;border-radius:3px;font-size:14px;min-width:0}
.links svg{flex:none;width:22px;height:22px;stroke:var(--cop);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tels{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 0}
.tels a{display:inline-flex;align-items:center;gap:8px;color:var(--ivory);text-decoration:none;padding:9px 14px;border:1px solid var(--cop);border-radius:3px;direction:ltr;unicode-bidi:isolate;font:500 17px 'Jost',sans-serif;letter-spacing:.03em}
.tels svg{flex:none;width:18px;height:18px;stroke:var(--cop);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fine{font-size:12px;color:#7e968a;margin-top:22px}
@media (max-width:380px){.item .hd{flex-direction:column;gap:2px}h2{font-size:28px}.num{font-size:46px}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
 <div class="brand">ChillOut Massage</div>
 <div class="sub" id="sub"></div>
 <div class="orn" id="men"></div>
 <p class="intro" id="intro"></p>
</div></header>
<nav class="idx" aria-label="index"><div class="nv"><button id="lang" type="button" aria-label="Language">English</button><div class="in"><a href="index.html" id="menu-link">قائمة الأسعار</a></div></div></nav>
<main class="wrap" id="app"></main>
<footer><div class="wrap" id="contact"></div><div style="text-align:center;padding:0 0 26px"><a href="admin.html" style="color:#5f7a6e;font-size:12px;text-decoration:none;letter-spacing:.02em">دخول الإدارة</a></div></footer>

<script src="menu-data.js"></script>
<script>
const DATA = window.MENU_DATA;
let L = "ar";
try { L = localStorage.getItem("co-lang") === "en" ? "en" : "ar"; } catch (e) {}
const t = o => (o && (o[L] ?? o.ar)) || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cur = () => t(DATA.currency);
const media = (cls, src, alt) => `<div class="${cls}">${src ? `<img src="${esc(src)}" alt="${esc(alt || "")}" loading="lazy" decoding="async" onerror="this.remove()">` : ""}</div>`;
const sh = (n, o) => `<div class="sh"><span class="num">0${n}</span><h2>${esc(t(o))}</h2></div>`;
const EMPTY = { ar: "لا توجد عروض متاحة حاليًا.", en: "No offers available at the moment." };
const priceHtml = it => {
  const has = it.price != null && it.price !== "" && Number(it.price) > 0;
  const hasOld = it.oldPrice != null && it.oldPrice !== "" && Number(it.oldPrice) > 0;
  if (!has && !hasOld) return "";
  return `<span class="pr">${hasOld ? `<s class="old">${it.oldPrice}</s>` : ""}${has ? `<b>${it.price}</b><small>${cur()}</small>` : ""}</span>`;
};
function render() {
  const D = DATA, u = D.ui;
  document.documentElement.lang = L;
  document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
  document.getElementById("lang").textContent = L === "ar" ? "English" : "العربية";
  document.getElementById("menu-link").textContent = L === "ar" ? "قائمة الأسعار" : "Price List";
  const off = D.offers || { title: { ar: "العروض", en: "Offers" }, items: [] };
  document.getElementById("sub").textContent = t(off.title);
  document.getElementById("men").textContent = t(u.men);
  document.getElementById("intro").textContent = t(u.intro);
  if (D.hero) { const hd = document.querySelector("header.top"); hd.style.setProperty("--hero", `url("${D.hero}")`); hd.classList.add("hero"); }
  let h = `<section>${sh(1, off.title)}`;
  if (!off.items || !off.items.length) {
    h += `<div class="note">${esc(t(EMPTY))}</div>`;
  } else {
    h += off.items.map(i => `<div class="item">${media("ph", i.img, t(i.name))}
    <div class="hd"><h3>${esc(t(i.name))}</h3>${priceHtml(i)}</div>
    ${i.desc && (i.desc.ar || i.desc.en) ? `<p class="inc">${esc(t(i.desc))}</p>` : ""}</div>`).join("");
  }
  h += `</section>`;
  document.getElementById("app").innerHTML = h;
  const c = D.contact;
  document.getElementById("contact").innerHTML = `<div class="eyebrow">CHILLOUT MASSAGE</div><div class="sh"><h2>${esc(t(u.contact))}</h2></div>
    <div class="adr"><strong>${esc(t(u.branch))}</strong><br>${esc(t(u.address))}</div>
    <ul class="links">${c.links.map(k => `<li><a href="${k.url}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${k.ic}"/></svg><span>${esc(t(k.label))}</span></a></li>`).join("")}</ul>
    <div class="sm" style="color:#8fa89a">${esc(t(u.more))}</div>
    <div class="tels">${c.phones.map(p => `<a href="tel:${p.tel}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/></svg><span>${p.show}</span></a>`).join("")}</div>
    <p class="fine">${esc(t(u.fine))}</p>`;
}
document.getElementById("lang").addEventListener("click", () => {
  L = L === "ar" ? "en" : "ar";
  try { localStorage.setItem("co-lang", L); } catch (e) {}
  render();
});
render();
</script>
</body>
</html>
